<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo App</title>
    <link rel="stylesheet" href="todo-style.css">
</head>
<body>

    <div class="todo-container">
        <h1>Todo App</h1>

        <form id="todo-form">
            <input
                type="text"
                id="todo-input"
                placeholder="What needs doing?"
                autocomplete="off"
            >
            <button type="submit">Add</button>
        </form>

        <p class="tip">
            Tip: double-click a todo to edit. Press Enter to save.
        </p>

        <div class="filters">
            <button type="button" class="filter active" data-filter="all">
                All
            </button>
            <button type="button" class="filter" data-filter="active">
                Active
            </button>
            <button type="button" class="filter" data-filter="completed">
                Completed
            </button>
        </div>

        <ul id="todo-list"></ul>

        <div class="todo-footer">
            <span id="items-left">0 items left</span>

            <div class="footer-buttons">
                <button type="button" id="clear-completed">
                    Clear completed
                </button>
                <button type="button" id="clear-all">
                    Clear all
                </button>
            </div>
        </div>
    </div>

    <script src="dist/todo-app.js"></script>
</body>
</html>
